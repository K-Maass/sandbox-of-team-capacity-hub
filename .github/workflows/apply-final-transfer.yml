name: Apply final Team Capacity Hub transfer
on:
  push:
    branches:
      - transfer/final-v2
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact final source files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .transfer/index.tsx.gz.b64 | gzip -d > src/routes/_authenticated/index.tsx
          base64 -d .transfer/profile.tsx.gz.b64 | gzip -d > src/routes/_authenticated/profile.tsx
          test "$(git hash-object src/routes/_authenticated/index.tsx)" = "3a8b6093453fc69c2c25ab72662f340367748304"
          test "$(git hash-object src/routes/_authenticated/profile.tsx)" = "42bd60b35d52cc23f25370d24e61c45ddb6eb1da"
          rm -rf .transfer
          rm -f .github/workflows/apply-final-transfer.yml
          git config user.name "Team Capacity Hub Transfer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Team Capacity Hub source transfer"
          git push origin HEAD:transfer/final-v2
